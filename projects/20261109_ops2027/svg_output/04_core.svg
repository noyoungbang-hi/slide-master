    <path d="M292 516 L540 452" fill="none" stroke="#6C86B8" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M988 516 L740 452" fill="none" stroke="#6C86B8" stroke-width="3" stroke-dasharray="6 8"/>
  </g>
  <g id="hub-building">
