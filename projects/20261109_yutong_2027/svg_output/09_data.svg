    <text x="902" y="430" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">반영 지원체계</text>
    <text x="902" y="466" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">로드맵 수립·시행</text>
    <text x="902" y="502" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#DCE4F2">중장기 전략,</text>
    <text x="902" y="538" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#DCE4F2">신규사업 연계</text>
