<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="72" y="52" width="48" height="6" fill="#1F8A3E"/>
    <text x="72" y="96" letter-spacing="2" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#1F8A3E">08 · 과제 03 영업채널 지원·데이터</text>
    <text x="72" y="156" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="700" fill="#0B1F4B">데이터 기반으로 영업채널을 지원합니다</text>
    <text x="72" y="206" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" fill="#5B6577">데이터 체계 → 물류비 지표 → 지원체계 로드맵</text>
  </g>
  <g id="step-data">
    <rect x="72" y="250" width="330" height="380" fill="#F2F5FA"/>
    <text x="96" y="294" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#1F8A3E">STEP 1</text>
    <text x="96" y="340" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">데이터 체계</text>
    <text x="96" y="394" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">판매·재고·수요</text>
    <text x="96" y="430" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">데이터 기반</text>
    <text x="96" y="466" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">유통 운영 체계</text>
    <text x="96" y="502" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">수립 시도</text>
  </g>
  <g id="step-index">
    <rect x="475" y="250" width="330" height="380" fill="#F2F5FA"/>
    <text x="499" y="294" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#1F8A3E">STEP 2</text>
    <text x="499" y="340" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">물류비 지표</text>
    <text x="499" y="394" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">활동기준원가</text>
    <text x="499" y="430" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">모델 적용으로</text>
    <text x="499" y="466" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">채널·공정별</text>
