<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="72" y="52" width="48" height="6" fill="#1F8A3E"/>
    <text x="72" y="96" letter-spacing="2" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#1F8A3E">03 · 로드맵</text>
    <text x="72" y="156" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="700" fill="#0B1F4B">지금은 로드맵 2단계, Hub센터 완성 단계입니다</text>
    <text x="72" y="206" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" fill="#5B6577">물리적 거점을 넘어, 데이터 기반 지능형 물류로 전환</text>
  </g>
  <g id="ground">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D9DEE7" stroke-width="2"/>
  </g>
  <g id="step-1">
    <rect x="72" y="500" width="360" height="140" fill="#DCE4F2"/>
    <text x="96" y="536" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">Phase 1 · 2009~2022</text>
    <text x="96" y="580" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">인프라 구축과</text>
    <text x="96" y="618" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">확장</text>
  </g>
  <g id="step-2">
    <rect x="460" y="410" width="360" height="230" fill="#0B1F4B"/>
    <text x="484" y="446" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#DCE4F2">Phase 2 · 2023~2027</text>
    <text x="484" y="490" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">경쟁력 강화 /</text>
    <text x="484" y="528" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Hub센터 완성</text>
    <text x="484" y="580" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#DCE4F2">서비스 확대 · 통합 거점</text>
    <rect x="460" y="366" width="120" height="36" fill="#1F8A3E"/>
    <text x="520" y="392" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">현재</text>
  </g>
  <g id="step-3">
    <rect x="848" y="320" width="360" height="320" fill="#FFFFFF" stroke="#6C86B8" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="872" y="356" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">Phase 3 · 2028~2030</text>
    <text x="872" y="400" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">지능화 전환</text>
    <text x="872" y="448" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">공유형 유통체계 · AI 물류</text>
  </g>
  <g id="footer">
    <text x="72" y="700" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#8A93A3">출처: 2027년 유통지원단 운영방향 (2026.10)</text>
    <text x="1208" y="700" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#8A93A3">04 / 11</text>
  </g>
</svg>
