<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="72" y="96" letter-spacing="2" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#1F8A3E">과제 1 · 운영모델</text>
    <text x="72" y="156" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="700" fill="#0B1F4B">운영모델을 네 가지로 완성합니다</text>
  </g>
  <g id="loop-ring">
    <circle cx="640" cy="420" r="150" fill="none" stroke="#DCE4F2" stroke-width="8" stroke-dasharray="16 12"/>
    <circle cx="550" cy="300" r="10" fill="#1F8A3E"/>
    <circle cx="730" cy="300" r="10" fill="#1F8A3E"/>
    <circle cx="550" cy="540" r="10" fill="#1F8A3E"/>
    <circle cx="730" cy="540" r="10" fill="#1F8A3E"/>
  </g>
  <g id="core">
    <circle cx="640" cy="420" r="90" fill="#0B1F4B"/>
    <text x="640" y="412" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">통합</text>
    <text x="640" y="452" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">운영모델</text>
  </g>
  <g id="node-operation">
    <circle cx="130" cy="300" r="52" fill="#DCE4F2"/>
    <use data-icon="tabler-outline/settings" x="102" y="272" width="56" height="56" fill="#0B1F4B"/>
    <text x="204" y="296" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">운영</text>
    <text x="204" y="334" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">현장 이슈 적기 대응</text>
  </g>
  <g id="node-process">
    <circle cx="1150" cy="300" r="52" fill="#DCE4F2"/>
    <use data-icon="tabler-outline/route" x="1122" y="272" width="56" height="56" fill="#0B1F4B"/>
    <text x="1076" y="296" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">프로세스</text>
    <text x="1076" y="334" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">채널별 고효율 구현</text>
  </g>
  <g id="node-manual">
    <circle cx="130" cy="540" r="52" fill="#DCE4F2"/>
    <use data-icon="tabler-outline/file-text" x="102" y="512" width="56" height="56" fill="#0B1F4B"/>
    <text x="204" y="536" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">매뉴얼</text>
    <text x="204" y="574" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">전 공정 단일 표준작업지침</text>
  </g>
  <g id="node-policy">
    <circle cx="1150" cy="540" r="52" fill="#DCE4F2"/>
    <use data-icon="tabler-outline/gavel" x="1122" y="512" width="56" height="56" fill="#0B1F4B"/>
    <text x="1076" y="536" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">정책</text>
    <text x="1076" y="574" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">Hub센터 중심 개편</text>
  </g>
  <g id="page-no">
    <text x="1208" y="690" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#8A93A3">07 / 10</text>
  </g>
