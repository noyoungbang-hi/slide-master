<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="image-panel">
    <rect x="560" y="0" width="720" height="720" fill="#F2F5FA"/>
    <line x1="600" y1="600" x2="1280" y2="600" stroke="#D9DEE7" stroke-width="2"/>
  </g>
  <g id="step-build">
    <rect x="620" y="480" width="150" height="120" fill="#DCE4F2"/>
  </g>
  <g id="step-up">
