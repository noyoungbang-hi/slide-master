<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="toc">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="72" y="96" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#1F8A3E">오늘의 이야기</text>
    <text x="72" y="156" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="700" fill="#0B1F4B">오늘, 세 장면으로 말씀드리겠습니다</text>
  </g>
  <g id="path-lines">
    <line x1="316" y1="400" x2="556" y2="400" stroke="#6C86B8" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round"/>
    <polygon points="556,388 580,400 556,412" fill="#6C86B8"/>
    <line x1="716" y1="400" x2="956" y2="400" stroke="#6C86B8" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round"/>
    <polygon points="956,388 980,400 956,412" fill="#6C86B8"/>
  </g>
  <g id="scene-1">
    <circle cx="240" cy="400" r="76" fill="#DCE4F2"/>
    <use data-icon="tabler-outline/route" x="208" y="368" width="64" height="64" fill="#0B1F4B"/>
    <text x="240" y="520" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">걸어온 길</text>
    <text x="240" y="562" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">센터를 만들고 넓힌 시간</text>
  </g>
  <g id="scene-2">
    <circle cx="640" cy="400" r="76" fill="#DCE4F2"/>
    <use data-icon="tabler-outline/map-pin" x="608" y="368" width="64" height="64" fill="#0B1F4B"/>
    <text x="640" y="520" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">지금 우리 자리</text>
    <text x="640" y="562" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">하나로 모으는 중</text>
  </g>
  <g id="scene-3">
    <circle cx="1040" cy="400" r="76" fill="#1F8A3E"/>
    <use data-icon="tabler-outline/flag" x="1008" y="368" width="64" height="64" fill="#FFFFFF"/>
    <text x="1040" y="520" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#1F8A3E">내년에 끝낼 일</text>
    <text x="1040" y="562" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6577">통합 운영모델 완성</text>
  </g>
  <g id="page-no">
    <text x="1208" y="690" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#8A93A3">02 / 10</text>
