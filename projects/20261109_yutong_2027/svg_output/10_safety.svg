    <text x="902" y="388" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">무재해 사업장</text>
    <text x="902" y="438" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">법규 준수 체계</text>
    <text x="902" y="474" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">확립을 통한</text>
    <text x="902" y="510" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">상시 무재해</text>
    <text x="902" y="546" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">사업장 구축</text>
