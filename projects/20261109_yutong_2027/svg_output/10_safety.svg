<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="72" y="52" width="48" height="6" fill="#1F8A3E"/>
    <text x="72" y="96" letter-spacing="2" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#1F8A3E">09 · 과제 04 리스크 방어·안전</text>
    <text x="72" y="156" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="700" fill="#0B1F4B">소방·산업안전과 중대재해 대응을 강화합니다</text>
    <text x="72" y="206" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" fill="#5B6577">위험을 사전에 차단하고 상시 무재해 사업장을 구축</text>
  </g>
  <g id="step-consulting">
    <rect x="72" y="250" width="330" height="380" fill="#F2F5FA"/>
    <circle cx="124" cy="306" r="28" fill="#0B1F4B"/>
    <use data-icon="tabler-outline/flame" x="108" y="290" width="32" height="32" fill="#FFFFFF"/>
    <text x="168" y="314" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#1F8A3E">STEP 1</text>
    <text x="96" y="388" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">통합컨설팅</text>
    <text x="96" y="438" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">소방·산업안전</text>
    <text x="96" y="474" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">통합컨설팅 기반</text>
    <text x="96" y="510" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">화재 취약요인과</text>
    <text x="96" y="546" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">위험 사전 차단</text>
  </g>
  <g id="step-roadmap">
    <rect x="475" y="250" width="330" height="380" fill="#F2F5FA"/>
    <circle cx="527" cy="306" r="28" fill="#0B1F4B"/>
    <use data-icon="tabler-outline/clipboard-check" x="511" y="290" width="32" height="32" fill="#FFFFFF"/>
    <text x="571" y="314" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#1F8A3E">STEP 2</text>
    <text x="499" y="388" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#0B1F4B">안전·방재 로드맵</text>
    <text x="499" y="438" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">중대재해처벌법</text>
    <text x="499" y="474" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">필수요건 충족</text>
    <text x="499" y="510" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#1A2233">로드맵 수립·시행</text>
  </g>
  <g id="step-goal">
    <rect x="878" y="250" width="330" height="380" fill="#0B1F4B"/>
