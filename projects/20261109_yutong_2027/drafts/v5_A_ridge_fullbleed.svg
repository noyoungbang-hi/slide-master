<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0B1F4B"/>
  <image href="../images/ridge_a.jpg" xlink:href="../images/ridge_a.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1280" height="720" fill="#0B1F4B" fill-opacity="0.42"/>
  <g id="kicker">
    <rect x="72" y="76" width="48" height="6" fill="#1F8A3E"/>
    <text x="72" y="120" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#DDF1E3">2027 유통지원단 슬로건</text>
  </g>
  <g id="slogan">
    <text x="72" y="220" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="80" font-weight="700" fill="#FFFFFF">Build Up <tspan fill="#DDF1E3">Beyond</tspan></text>
  </g>
  <g id="caption-build">
    <text x="72" y="600" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Build</text>
    <text x="72" y="640" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">2009년부터 인프라를 만들고</text>
    <text x="72" y="672" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">넓혀 왔습니다</text>
  </g>
  <g id="caption-up">
    <text x="470" y="600" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Up</text>
    <text x="470" y="640" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">2027년 Hub센터를 안정시키고</text>
    <text x="470" y="672" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">통합 운영모델을 완성합니다</text>
  </g>
  <g id="caption-beyond">
    <text x="880" y="600" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="700" fill="#DDF1E3">Beyond</text>
    <text x="880" y="640" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">물리적 거점을 넘어</text>
    <text x="880" y="672" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF">데이터 기반 지능형 물류로</text>
  </g>
</svg>
