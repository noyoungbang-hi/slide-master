  <rect x="0" y="0" width="1280" height="340" fill="url(#t)"/>
  <rect x="0" y="430" width="1280" height="290" fill="url(#b)"/>
  <g id="kicker"><rect x="72" y="60" width="48" height="6" fill="#1F8A3E"/>
    <text x="72" y="106" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#DDF1E3">2027 유통지원단 슬로건</text></g>
  <g id="slogan"><text x="72" y="204" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="80" font-weight="700" fill="#FFFFFF">Build Up <tspan fill="#DDF1E3">Beyond</tspan></text>
    <text x="72" y="268" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" fill="#FFFFFF">우리는 지어 왔고, 올려 왔고, 이제 넘어섭니다.</text></g>
  <g id="timeline">
    <line x1="72" y1="560" x2="1208" y2="560" stroke="#DCE4F2" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="80" cy="560" r="8" fill="#DCE4F2"/>
    <circle cx="478" cy="560" r="8" fill="#DDF1E3"/>
    <circle cx="888" cy="560" r="10" fill="#1F8A3E" stroke="#FFFFFF" stroke-width="3"/></g>
