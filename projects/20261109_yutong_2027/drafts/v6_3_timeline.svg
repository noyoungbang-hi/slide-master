<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs><linearGradient id="t" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0B1F4B" stop-opacity="0.6"/><stop offset="1" stop-color="#0B1F4B" stop-opacity="0"/></linearGradient><linearGradient id="b" x1="0" y1="430" x2="0" y2="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0B1F4B" stop-opacity="0"/><stop offset="1" stop-color="#0B1F4B" stop-opacity="0.85"/></linearGradient></defs>
  <rect x="0" y="0" width="1280" height="720" fill="#0B1F4B"/>
