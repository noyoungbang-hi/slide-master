<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0B1F4B"/>
  <g id="case-line">
    <rect x="72" y="120" width="64" height="8" fill="#1F8A3E"/>
    <text x="72" y="196" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="32" font-weight="500" fill="#DCE4F2">
